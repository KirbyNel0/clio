[package]
name = "clio"
version = "0.1.0"
edition = "2024"

authors = ["KirbyNel0"]
readme = "README.md"
license = "MIT"
license-file = "LICENSE"

categories = ["command-line-interface", "development-tools", "filesystem"]

[dependencies]
serde = { version = "1.0.229", optional = true, default-features = false }

[features]
default = []
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1.0.151"
clap = { version = "4.6.7", features = ["derive"] }

[[example]]
name = "clap"

[[example]]
name = "serde"
required-features = ["serde"]
